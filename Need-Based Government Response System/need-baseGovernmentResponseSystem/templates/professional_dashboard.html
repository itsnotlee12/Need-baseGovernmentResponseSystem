{% extends "base.html" %}

{% block title %}Professional Dashboard - Mental Health Services{% endblock %}

{% block content %}
<div class="min-h-screen bg-[#faeee7]">
    <!-- Header -->
    <div class="bg-gradient-to-r from-[#33272a] to-[#594a4e] text-white py-6 shadow-lg">
        <div class="max-w-7xl mx-auto px-4">
            <div class="flex items-center justify-between">
                <div class="flex items-center gap-4">
                    <div class="w-12 h-12 bg-white/20 backdrop-blur-sm rounded-xl flex items-center justify-center">
                        <i data-lucide="stethoscope" class="w-6 h-6 text-white"></i>
                    </div>
                    <div>
                        <h1 class="text-2xl font-bold">{{ professional_name }}</h1>
                        <p class="text-white/80 text-sm">Mental Health Professional</p>
                    </div>
                </div>
                
                <div class="flex items-center gap-4">
                    <!-- Notifications -->
                    <div class="relative">
                        <button id="notificationsBtn" class="p-2 bg-white/10 rounded-lg hover:bg-white/20 transition-colors relative">
                            <i data-lucide="bell" class="w-5 h-5"></i>
                            {% if unread_notifications > 0 %}
                            <span class="absolute -top-1 -right-1 w-5 h-5 bg-red-500 text-white text-xs rounded-full flex items-center justify-center">
                                {{ unread_notifications }}
                            </span>
                            {% endif %}
                        </button>
                    </div>
                    
                    <!-- Logout -->
                    <a href="/api/logout" class="px-4 py-2 bg-white/10 rounded-lg hover:bg-white/20 transition-colors flex items-center gap-2">
                        <i data-lucide="log-out" class="w-4 h-4"></i>
                        <span>Logout</span>
                    </a>
                </div>
            </div>
        </div>
    </div>

    <!-- Main Content -->
    <div class="max-w-7xl mx-auto px-4 py-8">
        <!-- Stats Cards -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
            <div class="bg-white rounded-xl shadow-lg p-6 border-l-4 border-orange-500">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-sm text-gray-600 mb-1">Pending Appointments</p>
                        <p class="text-3xl font-bold text-[#33272a]" id="pendingCount">0</p>
                    </div>
                    <div class="w-12 h-12 bg-orange-100 rounded-xl flex items-center justify-center">
                        <i data-lucide="clock" class="w-6 h-6 text-orange-500"></i>
                    </div>
                </div>
            </div>

            <div class="bg-white rounded-xl shadow-lg p-6 border-l-4 border-green-500">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-sm text-gray-600 mb-1">Confirmed Appointments</p>
                        <p class="text-3xl font-bold text-[#33272a]" id="confirmedCount">0</p>
                    </div>
                    <div class="w-12 h-12 bg-green-100 rounded-xl flex items-center justify-center">
                        <i data-lucide="check-circle" class="w-6 h-6 text-green-500"></i>
                    </div>
                </div>
            </div>

            <div class="bg-white rounded-xl shadow-lg p-6 border-l-4 border-blue-500">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-sm text-gray-600 mb-1">Completed Sessions</p>
                        <p class="text-3xl font-bold text-[#33272a]" id="completedCount">0</p>
                    </div>
                    <div class="w-12 h-12 bg-blue-100 rounded-xl flex items-center justify-center">
                        <i data-lucide="user-check" class="w-6 h-6 text-blue-500"></i>
                    </div>
                </div>
            </div>
        </div>

        <!-- Appointments Tabs -->
        <div class="bg-white rounded-xl shadow-lg">
            <!-- Tab Headers -->
            <div class="border-b border-gray-200 px-6 pt-6">
                <div class="flex gap-4">
                    <button class="tab-btn active px-6 py-3 font-semibold border-b-2 border-[#33272a] text-[#33272a]" data-tab="pending">
                        Pending Confirmation
                    </button>
                    <button class="tab-btn px-6 py-3 font-semibold border-b-2 border-transparent text-gray-500 hover:text-[#33272a]" data-tab="confirmed">
                        Confirmed
                    </button>
                    <button class="tab-btn px-6 py-3 font-semibold border-b-2 border-transparent text-gray-500 hover:text-[#33272a]" data-tab="completed">
                        Completed
                    </button>
                </div>
            </div>

            <!-- Tab Content -->
            <div class="p-6">
                <!-- Pending Appointments -->
                <div id="pending-tab" class="tab-content">
                    <div id="pendingAppointments">
                        <!-- Will be populated by JavaScript -->
                    </div>
                </div>

                <!-- Confirmed Appointments -->
                <div id="confirmed-tab" class="tab-content hidden">
                    <div id="confirmedAppointments">
                        <!-- Will be populated by JavaScript -->
                    </div>
                </div>

                <!-- Completed Appointments -->
                <div id="completed-tab" class="tab-content hidden">
                    <div id="completedAppointments">
                        <!-- Will be populated by JavaScript -->
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
// Appointments data
const appointments = {{ appointments|tojson }};

// Calculate counts
function updateCounts() {
    const pendingCount = appointments.filter(a => a.status === 'pending').length;
    const confirmedCount = appointments.filter(a => a.status === 'confirmed').length;
    const completedCount = appointments.filter(a => a.status === 'completed').length;
    
    document.getElementById('pendingCount').textContent = pendingCount;
    document.getElementById('confirmedCount').textContent = confirmedCount;
    document.getElementById('completedCount').textContent = completedCount;
}

// Format date for display
function formatDate(dateStr) {
    const date = new Date(dateStr);
    return date.toLocaleDateString('en-US', { weekday: 'short', year: 'numeric', month: 'short', day: 'numeric' });
}

// Format time for display
function formatTime(timeStr) {
    if (!timeStr) return '';
    const [hours, minutes] = timeStr.split(':');
    const hour = parseInt(hours);
    const ampm = hour >= 12 ? 'PM' : 'AM';
    const displayHour = hour > 12 ? hour - 12 : (hour === 0 ? 12 : hour);
    return `${displayHour}:${minutes} ${ampm}`;
}

// Render appointments
function renderAppointments() {
    const pendingContainer = document.getElementById('pendingAppointments');
    const confirmedContainer = document.getElementById('confirmedAppointments');
    const completedContainer = document.getElementById('completedAppointments');
    
    const pending = appointments.filter(a => a.status === 'pending');
    const confirmed = appointments.filter(a => a.status === 'confirmed');
    const completed = appointments.filter(a => a.status === 'completed');
    
    // Render pending
    if (pending.length === 0) {
        pendingContainer.innerHTML = `
            <div class="text-center py-16">
                <div class="w-20 h-20 bg-gray-100 rounded-full flex items-center justify-center mx-auto mb-4">
                    <i data-lucide="calendar-x" class="w-10 h-10 text-gray-400"></i>
                </div>
                <p class="text-gray-500 font-semibold">No pending appointments</p>
                <p class="text-sm text-gray-400 mt-1">New appointment requests will appear here</p>
            </div>
        `;
    } else {
        pendingContainer.innerHTML = pending.map(appt => `
            <div class="border-2 border-orange-200 bg-orange-50 rounded-xl p-6 mb-4 hover:shadow-lg transition-all">
                <div class="flex items-start justify-between mb-4">
                    <div class="flex-1">
                        <div class="flex items-center gap-2 mb-2">
                            <div class="w-10 h-10 bg-orange-200 rounded-full flex items-center justify-center">
                                <i data-lucide="user" class="w-5 h-5 text-orange-700"></i>
                            </div>
                            <div>
                                <h3 class="text-lg font-bold text-[#33272a]">${appt.citizen_name}</h3>
                                <p class="text-sm text-gray-600">${appt.citizen_email}</p>
                            </div>
                        </div>
                    </div>
                    <span class="px-4 py-2 bg-orange-500 text-white rounded-full text-sm font-bold shadow-sm">
                        <i data-lucide="clock" class="w-4 h-4 inline mr-1"></i>
                        Pending
                    </span>
                </div>
                
                <div class="bg-white rounded-lg p-4 mb-4">
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <p class="text-xs text-gray-500 mb-1 font-semibold uppercase">Date</p>
                            <p class="text-sm font-bold text-[#33272a]">
                                <i data-lucide="calendar" class="w-4 h-4 inline mr-1 text-orange-500"></i>
                                ${formatDate(appt.date)}
                            </p>
                        </div>
                        <div>
                            <p class="text-xs text-gray-500 mb-1 font-semibold uppercase">Time</p>
                            <p class="text-sm font-bold text-[#33272a]">
                                <i data-lucide="clock" class="w-4 h-4 inline mr-1 text-orange-500"></i>
                                ${formatTime(appt.time)}
                            </p>
                        </div>
                        <div>
                            <p class="text-xs text-gray-500 mb-1 font-semibold uppercase">Phone</p>
                            <p class="text-sm font-bold text-[#33272a]">
                                <i data-lucide="phone" class="w-4 h-4 inline mr-1 text-orange-500"></i>
                                ${appt.citizen_phone || 'Not provided'}
                            </p>
                        </div>
                        <div>
                            <p class="text-xs text-gray-500 mb-1 font-semibold uppercase">Type</p>
                            <p class="text-sm font-bold text-[#33272a] capitalize">
                                <i data-lucide="file-text" class="w-4 h-4 inline mr-1 text-orange-500"></i>
                                ${appt.type}
                            </p>
                        </div>
                    </div>
                </div>
                
                ${appt.notes ? `
                <div class="bg-blue-50 border-l-4 border-blue-400 p-4 mb-4 rounded">
                    <p class="text-xs text-blue-700 mb-1 font-semibold uppercase">
                        <i data-lucide="message-square" class="w-4 h-4 inline mr-1"></i>
                        Staff Notes
                    </p>
                    <p class="text-sm text-blue-900">${appt.notes}</p>
                </div>
                ` : ''}
                
                <div class="flex gap-3">
                    <button onclick="confirmAppointment('${appt.appointment_id}')"
                            class="flex-1 px-6 py-3 bg-green-600 text-white rounded-lg hover:bg-green-700 transition-colors font-bold flex items-center justify-center gap-2 shadow-md hover:shadow-lg">
                        <i data-lucide="check-circle" class="w-5 h-5"></i>
                        Confirm Appointment
                    </button>
                    <button onclick="viewDetails('${appt.appointment_id}')"
                            class="px-6 py-3 bg-gray-200 text-gray-700 rounded-lg hover:bg-gray-300 transition-colors font-semibold flex items-center justify-center gap-2">
                        <i data-lucide="eye" class="w-5 h-5"></i>
                        Details
                    </button>
                </div>
            </div>
        `).join('');
    }
    
    // Render confirmed
    if (confirmed.length === 0) {
        confirmedContainer.innerHTML = `
            <div class="text-center py-16">
                <div class="w-20 h-20 bg-gray-100 rounded-full flex items-center justify-center mx-auto mb-4">
                    <i data-lucide="calendar-check" class="w-10 h-10 text-gray-400"></i>
                </div>
                <p class="text-gray-500 font-semibold">No confirmed appointments</p>
                <p class="text-sm text-gray-400 mt-1">Confirmed appointments will appear here</p>
            </div>
        `;
    } else {
        confirmedContainer.innerHTML = confirmed.map(appt => `
            <div class="border-2 border-green-200 bg-green-50 rounded-xl p-6 mb-4 hover:shadow-lg transition-all">
                <div class="flex items-start justify-between mb-4">
                    <div class="flex-1">
                        <div class="flex items-center gap-2 mb-2">
                            <div class="w-10 h-10 bg-green-200 rounded-full flex items-center justify-center">
                                <i data-lucide="user-check" class="w-5 h-5 text-green-700"></i>
                            </div>
                            <div>
                                <h3 class="text-lg font-bold text-[#33272a]">${appt.citizen_name}</h3>
                                <p class="text-sm text-gray-600">${appt.citizen_email}</p>
                            </div>
                        </div>
                    </div>
                    <span class="px-4 py-2 bg-green-600 text-white rounded-full text-sm font-bold shadow-sm">
                        <i data-lucide="check-circle" class="w-4 h-4 inline mr-1"></i>
                        Confirmed
                    </span>
                </div>
                
                <div class="bg-white rounded-lg p-4 mb-3">
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <p class="text-xs text-gray-500 mb-1 font-semibold uppercase">Date</p>
                            <p class="text-sm font-bold text-[#33272a]">
                                <i data-lucide="calendar" class="w-4 h-4 inline mr-1 text-green-600"></i>
                                ${formatDate(appt.date)}
                            </p>
                        </div>
                        <div>
                            <p class="text-xs text-gray-500 mb-1 font-semibold uppercase">Time</p>
                            <p class="text-sm font-bold text-[#33272a]">
                                <i data-lucide="clock" class="w-4 h-4 inline mr-1 text-green-600"></i>
                                ${formatTime(appt.time)}
                            </p>
                        </div>
                        <div>
                            <p class="text-xs text-gray-500 mb-1 font-semibold uppercase">Phone</p>
                            <p class="text-sm font-bold text-[#33272a]">
                                <i data-lucide="phone" class="w-4 h-4 inline mr-1 text-green-600"></i>
                                ${appt.citizen_phone || 'Not provided'}
                            </p>
                        </div>
                        <div>
                            <p class="text-xs text-gray-500 mb-1 font-semibold uppercase">Confirmed</p>
                            <p class="text-sm font-bold text-[#33272a]">
                                <i data-lucide="check" class="w-4 h-4 inline mr-1 text-green-600"></i>
                                ${formatDate(appt.confirmed_at)}
                            </p>
                        </div>
                    </div>
                </div>
                
                <div class="bg-green-100 border border-green-300 rounded-lg p-3">
                    <p class="text-xs text-green-800 font-semibold">
                        <i data-lucide="info" class="w-4 h-4 inline mr-1"></i>
                        Patient has been notified. Please be prepared for this session.
                    </p>
                </div>
            </div>
        `).join('');
    }
    
    // Render completed
    if (completed.length === 0) {
        completedContainer.innerHTML = `
            <div class="text-center py-16">
                <div class="w-20 h-20 bg-gray-100 rounded-full flex items-center justify-center mx-auto mb-4">
                    <i data-lucide="archive" class="w-10 h-10 text-gray-400"></i>
                </div>
                <p class="text-gray-500 font-semibold">No completed appointments</p>
                <p class="text-sm text-gray-400 mt-1">Completed sessions will appear here</p>
            </div>
        `;
    } else {
        completedContainer.innerHTML = completed.map(appt => `
            <div class="border border-gray-300 bg-gray-50 rounded-xl p-6 mb-4 opacity-80">
                <div class="flex items-start justify-between mb-4">
                    <div class="flex-1">
                        <div class="flex items-center gap-2 mb-2">
                            <div class="w-10 h-10 bg-blue-200 rounded-full flex items-center justify-center">
                                <i data-lucide="user-check" class="w-5 h-5 text-blue-700"></i>
                            </div>
                            <div>
                                <h3 class="text-lg font-bold text-[#33272a]">${appt.citizen_name}</h3>
                                <p class="text-sm text-gray-600">${formatDate(appt.date)} at ${formatTime(appt.time)}</p>
                            </div>
                        </div>
                    </div>
                    <span class="px-4 py-2 bg-blue-600 text-white rounded-full text-sm font-bold">
                        <i data-lucide="check-circle-2" class="w-4 h-4 inline mr-1"></i>
                        Completed
                    </span>
                </div>
            </div>
        `).join('');
    }
    
    // Reinitialize icons
    lucide.createIcons();
}

// Confirm appointment
async function confirmAppointment(appointmentId) {
    if (!confirm('Are you sure you want to confirm this appointment?\n\nThe patient will be notified with your contact details and the appointment confirmation.')) {
        return;
    }
    
    // Show loading state
    const btn = event.target.closest('button');
    const originalHTML = btn.innerHTML;
    btn.disabled = true;
    btn.innerHTML = '<i data-lucide="loader-2" class="w-5 h-5 inline animate-spin mr-2"></i>Confirming...';
    lucide.createIcons();
    
    try {
        const response = await fetch('/api/professional/confirm_appointment', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                appointment_id: appointmentId
            })
        });
        
        const data = await response.json();
        
        if (data.success) {
            // Show success message
            showNotification('Appointment confirmed successfully! Patient has been notified.', 'success');
            
            // Reload page after short delay
            setTimeout(() => {
                location.reload();
            }, 1500);
        } else {
            btn.disabled = false;
            btn.innerHTML = originalHTML;
            lucide.createIcons();
            showNotification('Error: ' + data.error, 'error');
        }
    } catch (error) {
        btn.disabled = false;
        btn.innerHTML = originalHTML;
        lucide.createIcons();
        showNotification('An error occurred. Please try again.', 'error');
    }
}

// View details (placeholder)
function viewDetails(appointmentId) {
    const appt = appointments.find(a => a.appointment_id === appointmentId);
    if (appt) {
        alert(`Appointment Details:\n\nPatient: ${appt.citizen_name}\nEmail: ${appt.citizen_email}\nPhone: ${appt.citizen_phone || 'Not provided'}\nDate: ${formatDate(appt.date)}\nTime: ${formatTime(appt.time)}\nType: ${appt.type}\nNotes: ${appt.notes || 'None'}`);
    }
}

// Show notification
function showNotification(message, type = 'info') {
    const notification = document.createElement('div');
    notification.className = `fixed top-4 right-4 px-6 py-4 rounded-lg shadow-lg text-white z-50 transition-all transform ${
        type === 'success' ? 'bg-green-600' : 
        type === 'error' ? 'bg-red-600' : 
        'bg-blue-600'
    }`;
    notification.innerHTML = `
        <div class="flex items-center gap-3">
            <i data-lucide="${type === 'success' ? 'check-circle' : type === 'error' ? 'x-circle' : 'info'}" class="w-5 h-5"></i>
            <span class="font-semibold">${message}</span>
        </div>
    `;
    document.body.appendChild(notification);
    lucide.createIcons();
    
    setTimeout(() => {
        notification.style.opacity = '0';
        notification.style.transform = 'translateX(100%)';
        setTimeout(() => notification.remove(), 300);
    }, 3000);
}

// Tab switching
document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', function() {
        const tab = this.dataset.tab;
        
        // Update tab buttons
        document.querySelectorAll('.tab-btn').forEach(b => {
            b.classList.remove('active', 'border-[#33272a]', 'text-[#33272a]');
            b.classList.add('border-transparent', 'text-gray-500');
        });
        this.classList.add('active', 'border-[#33272a]', 'text-[#33272a]');
        this.classList.remove('border-transparent', 'text-gray-500');
        
        // Update tab content
        document.querySelectorAll('.tab-content').forEach(content => {
            content.classList.add('hidden');
        });
        document.getElementById(tab + '-tab').classList.remove('hidden');
    });
});

// Initialize
updateCounts();
renderAppointments();
</script>
{% endblock %}
